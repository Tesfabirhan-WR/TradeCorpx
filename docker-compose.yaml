services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: tradecorp_spark
    ports:
      - "8889:8888"
      - "4041:4040"
    volumes:
      - ./data/source_data:/home/jovyan/data/source_data
      - ./data/bronze:/home/jovyan/data/bronze
      - ./data/silver:/home/jovyan/data/silver
      - ./data/gold:/home/jovyan/data/gold
      - ./data/tmp/tradecorp_raw:/home/jovyan/data/tmp
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
      - ./tests:/home/jovyan/tests
    env_file:
      - .env
    environment:
      PYSPARK_SUBMIT_ARGS: "--packages org.postgresql:postgresql:42.7.0 pyspark-shell"
    restart: unless-stopped

  airflow-postgres-tradecorp:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    depends_on:
      airflow-postgres-tradecorp:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-postgres-tradecorp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    ports:
      - "8082:8080"
    user: "${AIRFLOW_UID:-1000}:0"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com || true
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./src:/home/jovyan/src
      - ./data:/home/jovyan/data

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: webserver
    container_name: airflow-webserver
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      airflow-postgres-tradecorp:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-postgres-tradecorp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./src:/home/jovyan/src
      - ./data:/home/jovyan/data
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    container_name: airflow-scheduler
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      airflow-postgres-tradecorp:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-postgres-tradecorp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./src:/home/jovyan/src
      - ./data:/home/jovyan/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --local || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-db-volume:
